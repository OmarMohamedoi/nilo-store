<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cart · Nilo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b4f4a'/%3E%3Ctext x='30' y='45' font-size='40' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3En%3C/text%3E%3Ccircle cx='47' cy='43' r='4.5' fill='%23ff6b3d'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="navbar"></div>
  <main class="container">
    <div class="page-head"><h1>My cart</h1></div>
    <p id="cart-message" class="msg"></p>

    <section class="card" id="cart-card">
      <div id="items"></div>
      <div class="cart-total" id="total"></div>
    </section>

    <section id="checkout" hidden>
      <h2>Payment</h2>
      <div class="checkout">
        <div class="pay-box">
          <h3>Pay now with PayPal</h3>
          <p class="muted">Secure sandbox payment. The order still waits for admin confirmation.</p>
          <div id="paypal-buttons"></div>
        </div>
        <div class="pay-box">
          <h3>Pay on delivery</h3>
          <p class="muted">Place the order now and pay when it arrives.</p>
          <button class="btn btn-primary btn-block" id="place-order">Place order</button>
        </div>
      </div>
    </section>
  </main>

  <script src="js/core/config.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/db.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/pages/cart.js"></script>
</body>
</html>
